name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add grammar versions you have implemented (e.g. [1, 2, 3, 4, 5])
        grammar: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schemas
        run: |
          pip install jsonschema
          python test/validate_schemas.py

      - name: Install test harness dependency
        run: pip install pytest

      - name: Build your compiler
        run: |
          # TODO: Replace with your compiler's build command
          # Examples:
          #   cargo build                          # Rust
          #   javac src/*.java -d build/            # Java
          #   go build -o build/splc ./src           # Go
          #   ghc -o build/splc src/Main.hs         # Haskell
          echo "No compiler configured. Edit this step to build your compiler."
          exit 1

      - name: Run tests for grammar ${{ matrix.grammar }}
        run: python3 test/run_tests.py test --grammar ${{ matrix.grammar }} --no-build
